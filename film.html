<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>動態設計十二法則 · The 12 Principles of Animation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@500;700;900&display=block" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
:root{
  --ink:#16171C; --red:#E8513A; --blue:#3B4FE0; --yellow:#F2B93B;
  --muted:#55565C;
  --mono:'JetBrains Mono','Noto Sans TC',monospace;
  --serif:'Instrument Serif',serif;
  --sans:'Archivo','Noto Sans TC',sans-serif;
  --zh:'Noto Sans TC',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}

/* ---------- 5:7 stage, 1080 × 1512 design units, scaled to fit ---------- */
#stage{position:absolute;left:0;top:0;width:1080px;height:1512px;transform-origin:0 0;overflow:hidden;color:var(--ink);font-family:var(--zh)}
#bg{position:absolute;inset:0;background-color:#ECECEE}
#bg::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 46%,rgba(255,255,255,.62) 0%,rgba(255,255,255,.22) 42%,rgba(255,255,255,0) 72%)}
#bg::after{content:"";position:absolute;inset:0;background:radial-gradient(140% 100% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.13) 100%)}
#backs,#fronts{position:absolute;inset:0}

/* ---------- 3D + annotation layer (the only area objects live in) ---------- */
#glwrap{position:absolute;left:0;top:470px;width:1080px;height:760px}
#glwrap canvas{position:absolute;left:0;top:0;width:1080px;height:760px;display:block}

/* ---------- top bar ---------- */
#topbar{position:absolute;left:72px;right:72px;top:46px;display:flex;justify-content:space-between;align-items:center;font:500 14px/1 var(--mono);letter-spacing:.24em;z-index:20;color:var(--ink)}
#topbar .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);margin-right:12px;vertical-align:1px}
#tc{font-variant-numeric:tabular-nums}

/* ---------- page (shared layout system) ---------- */
.page{position:absolute;inset:0;visibility:hidden}
.wm{position:absolute;left:-40px;right:-40px;top:470px;height:760px;display:flex;align-items:center;justify-content:center;font-family:'Archivo';font-weight:800;font-stretch:125%;font-variation-settings:'wdth' 125;font-size:600px;line-height:1;letter-spacing:-.03em;color:var(--ink);opacity:.06;white-space:nowrap}
.chap{position:absolute;left:72px;right:72px;top:100px;display:flex;align-items:center;gap:24px}
.chap .no{font:italic 400 44px/1 var(--serif);white-space:nowrap}
.chap .rule{flex:1;height:1px;background:rgba(22,23,28,.32);position:relative}
.chap .rule i{position:absolute;top:0;left:0;width:11px;height:11px;margin:-5px 0 0 -5.5px;border-radius:50%;background:var(--c,var(--red))}
.chap .cnt{font:500 15px/1 var(--mono);letter-spacing:.22em;white-space:nowrap}
.head{position:absolute;left:68px;right:72px;top:172px}
.ttl{margin:0;font-family:'Archivo',sans-serif;font-weight:800;font-stretch:125%;font-variation-settings:'wdth' 125;font-size:112px;line-height:.98;letter-spacing:-.012em}
.ln{display:block;overflow:hidden;padding:0 0 .06em}
.ln>span{display:inline-block;white-space:nowrap;will-change:transform}
.sub{margin:16px 0 0 4px;font:900 38px/1.25 var(--zh);letter-spacing:.15em}
.desc{position:absolute;left:72px;bottom:74px;width:580px;margin:0;font:500 22px/1.7 var(--zh);color:#4E4F56;letter-spacing:.02em}
.ease{position:absolute;right:72px;bottom:64px;width:330px;padding:16px 18px 14px;border-radius:22px;background:rgba(255,255,255,.58);border:1px solid rgba(255,255,255,.75);box-shadow:0 10px 30px rgba(22,23,28,.08),0 1px 0 rgba(255,255,255,.6) inset;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.ease .eh{display:flex;justify-content:space-between;align-items:baseline;font:500 11px/1 var(--mono);letter-spacing:.26em;color:#6A6B72}
.ease .eh b{font:700 13px/1 var(--mono);letter-spacing:.02em;color:var(--ink)}
.ease svg{display:block;width:294px;height:104px;margin:10px 0 6px}
.ease .en{font:500 13px/1.4 var(--mono);color:#5A5B62;letter-spacing:.04em}
.ease .grid{stroke:rgba(22,23,28,.16);stroke-width:1;stroke-dasharray:2 4;fill:none}
.ease .curve{stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round}
.ease .curve2{stroke:rgba(22,23,28,.45);stroke-width:1.6;fill:none;stroke-dasharray:4 5}
.ease .pt{fill:var(--c,var(--red));stroke:#fff;stroke-width:2.5}
.ease .pt2{fill:#fff;stroke:var(--ink);stroke-width:2}

/* opening cover specifics */
.cover .kick{position:absolute;left:72px;right:72px;top:104px;font:500 15px/1 var(--mono);letter-spacing:.3em;display:flex;align-items:center;gap:22px}
.cover .kick .rule{flex:1;height:1px;background:rgba(22,23,28,.32)}
.cover .head{top:160px}
.cover .zhT{margin:0;font:900 104px/1.12 var(--zh);letter-spacing:.06em}
.cover .desc{font-size:19.5px;white-space:nowrap;width:600px}
.cover .enT{margin:14px 0 0 4px;font-family:'Archivo';font-weight:800;font-stretch:125%;font-variation-settings:'wdth' 125;font-size:46px;line-height:1.1;letter-spacing:-.005em}

/* epilogue + fin */
.epi .idx{position:absolute;left:72px;right:72px;top:1148px;margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,1fr);column-gap:28px;row-gap:12px}
.epi .idx li{border-top:1px solid rgba(22,23,28,.22);padding-top:12px;display:flex;align-items:baseline;gap:12px;white-space:nowrap}
.epi .idx b{font:700 14px/1 var(--mono);letter-spacing:.1em;color:var(--red)}
.epi .idx span{font:700 20px/1.2 var(--zh);letter-spacing:.06em}
.fin{background:radial-gradient(110% 70% at 50% 45%,#23252D 0%,#16171C 70%);color:#F4F2EE}
.fin .fwrap{position:absolute;left:72px;right:72px;top:50%;transform:translateY(-50%)}
.fin .fword{font:italic 400 200px/1 var(--serif);margin:0 0 40px -6px}
.fin .fzh{margin:0;font:900 92px/1.15 var(--zh);letter-spacing:.06em}
.fin .fbrand{font-family:'Archivo',sans-serif;font-weight:800;font-stretch:125%;font-variation-settings:'wdth' 125;font-size:128px;line-height:1.05;letter-spacing:-.01em}
.fin .fen{margin:16px 0 0 4px;font-family:'Archivo';font-weight:800;font-stretch:125%;font-variation-settings:'wdth' 125;font-size:42px;line-height:1.1}
.fin .fnote{margin-top:64px}
.fin .fnote i{display:block;width:88px;height:5px;border-radius:3px;background:var(--red)}
.fin .fnote p{margin:28px 0 0;font:500 24px/1.7 var(--zh);color:#A9AAB2;letter-spacing:.06em}

/* ---------- chapter cards ---------- */
.card{position:absolute;left:0;top:-12%;width:100%;height:124%;z-index:40;visibility:hidden;--mb:0;background:var(--cc);color:var(--ct)}
.card::before,.card::after{content:"";position:absolute;left:0;right:0;height:calc(var(--mb) * 260px);pointer-events:none}
.card::before{bottom:100%;background:linear-gradient(to top,var(--cc),transparent)}
.card::after{top:100%;background:linear-gradient(to bottom,var(--cc),transparent)}
.card .stack{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%)}
.card .layer{display:flex;flex-direction:column;align-items:center;text-align:center}
.card .g{position:absolute;inset:0;opacity:.16;transform:translateY(calc(var(--mb) * var(--k) * 1px));filter:blur(calc(var(--mb) * 6px))}
.card .main{position:relative;transform:scaleY(calc(1 + var(--mb) * .18));filter:blur(calc(var(--mb) * 5px))}
.card .ckick{font:italic 400 64px/1 var(--serif);margin-bottom:28px}
.card .num{font-family:'Archivo';font-weight:800;font-stretch:125%;font-variation-settings:'wdth' 125;font-size:420px;line-height:.86;letter-spacing:-.03em}
.card .czh{margin-top:34px;font:900 66px/1.2 var(--zh);letter-spacing:.15em}
.card .cen{margin-top:12px;font:italic 400 58px/1.1 var(--serif)}

/* ---------- hidden HUD (H to toggle) ---------- */
#hud{position:fixed;left:0;right:0;bottom:0;padding:10px 16px;font:500 12px/1 var(--mono);color:#ddd;background:rgba(0,0,0,.6);display:none;z-index:99;gap:14px;align-items:center}
#hud.on{display:flex}
#hud .bar{flex:1;height:4px;background:#444;border-radius:2px;position:relative;cursor:pointer}
#hud .bar i{position:absolute;left:0;top:0;bottom:0;background:#fff;border-radius:2px}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="backs"></div>
  <div id="glwrap"><canvas id="c3d"></canvas><canvas id="c2d"></canvas></div>
  <div id="fronts"></div>
  <div id="topbar"><span><i class="dot"></i>COMP 01 · 動態設計十二法則</span><span id="tc">00:00:00:00</span></div>
  <div id="cards"></div>
</div>
<div id="hud"><span id="hudT">0.00s</span><div class="bar" id="hudBar"><i></i></div><span id="hudS">—</span></div>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* =====================================================================
   0. constants & helpers
   ===================================================================== */
const W = 1080, H = 1512;
const GL = { w: 1080, h: 760 };                // 3D demo area (top: 470px)
const HEX = { red:'#E8513A', blue:'#3B4FE0', yellow:'#F2B93B', ink:'#16171C' };
const BG  = { red:'#F3E3D8', blue:'#DDE2F1', yellow:'#F2ECD8', neutral:'#ECECEE', dark:'#16171C' };
const params = new URLSearchParams(location.search);
const SHOT = params.has('t');

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const smooth = u => u * u * (3 - 2 * u);
const E = name => gsap.parseEase(name);
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const pad2 = n => String(n).padStart(2, '0');

/* =====================================================================
   1. stage scaling (letterboxed, everything scales from canvas width)
   ===================================================================== */
const stage = $('#stage');
let pixelRatio = 1;
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  stage.style.transform = `translate(${(innerWidth - W * s) / 2}px,${(innerHeight - H * s) / 2}px) scale(${s})`;
  pixelRatio = clamp(Math.min(devicePixelRatio || 1, 2) * s, .5, 2);
  if (renderer) { renderer.setPixelRatio(pixelRatio); renderer.setSize(GL.w, GL.h, false); }
  c2d.width = Math.round(GL.w * pixelRatio); c2d.height = Math.round(GL.h * pixelRatio);
  if (window.__ready) frame();                          // resizing clears both canvases: redraw at once
}

/* =====================================================================
   2. three.js world — clay / gummy look, soft shadows on invisible floor
   ===================================================================== */
const c3d = $('#c3d'), c2d = $('#c2d');
const ctx = c2d.getContext('2d');
const renderer = new THREE.WebGLRenderer({ canvas: c3d, antialias: true, alpha: true, preserveDrawingBuffer: SHOT });
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
fit(); addEventListener('resize', fit);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(30, GL.w / GL.h, 0.1, 100);
const CAM0 = { pos: [0, 3.2, 15], target: [0, 1.9, 0], off: null };

scene.add(new THREE.HemisphereLight(0xffffff, 0xd9d2ca, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.55);
key.position.set(-4.5, 10, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 1, far: 30 });
key.shadow.radius = 8; key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.35); rim.position.set(5, 4, -6); scene.add(rim);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.ShadowMaterial({ opacity: 0.16 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

const clay = (color, o = {}) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.45, clearcoat: 0.3, clearcoatRoughness: 0.35, envMapIntensity: 0.5, ...o });
function finish(m) { m.castShadow = true; m.receiveShadow = true; return m; }
const ball = (r, c) => finish(new THREE.Mesh(new THREE.SphereGeometry(r, 64, 48), clay(c)));
const box = (w, h, d, c, rad = 0.24) => finish(new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 8, rad), clay(c)));
const capsule = (r, len, c) => finish(new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 16, 40), clay(c)));
/* group whose origin is the object's bottom (so scale.y squashes against the floor) */
function grounded(mesh, halfH) { const g = new THREE.Group(); mesh.position.y = halfH; g.add(mesh); return g; }
function ghostOf(mesh, opacity = 0.22) {
  const m = new THREE.Mesh(mesh.geometry, mesh.material.clone());
  Object.assign(m.material, { transparent: true, opacity, depthWrite: false });
  m.castShadow = false; m.receiveShadow = false; m.renderOrder = 2;
  return m;
}

const _v = new THREE.Vector3();
function proj(x, y, z) { _v.set(x, y, z).project(camera); return [(_v.x * .5 + .5) * GL.w, (-_v.y * .5 + .5) * GL.h]; }
function applyCam(c) {
  c = c || CAM0;
  camera.position.set(...c.pos); camera.lookAt(...c.target);
  if (c.off) camera.setViewOffset(GL.w, GL.h, c.off[0], c.off[1], GL.w, GL.h); else camera.clearViewOffset();
  camera.updateMatrixWorld();
}

/* =====================================================================
   3. 2D annotation helpers (canvas, drawn in the same tick as 3D)
   ===================================================================== */
const INK = '22,23,28';
function dot(x, y, r = 2.4, a = .4, rgb = INK) { ctx.fillStyle = `rgba(${rgb},${a})`; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function tag(ax, ay, lx, ly, text, a = 1, side = 1) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  ctx.font = "500 16px 'JetBrains Mono','Noto Sans TC',monospace";
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0.04em';
  const tw = ctx.measureText(text).width;
  lx = clamp(lx, 72 + 40, GL.w - 72 - 40);
  if (side < 0 && lx - 34 - tw < 72) side = 1;
  if (side > 0 && lx + 34 + tw > GL.w - 72) side = -1;
  ctx.strokeStyle = `rgba(${INK},.75)`; ctx.fillStyle = `rgb(${INK})`; ctx.lineWidth = 1.1;
  ctx.beginPath(); ctx.arc(ax, ay, 3.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(lx, ly); ctx.lineTo(lx + side * 26, ly); ctx.stroke();
  ctx.textBaseline = 'middle'; ctx.textAlign = side > 0 ? 'left' : 'right';
  ctx.fillText(text, lx + side * 34, ly + 1);
  ctx.restore();
}
function ring(x, y, rx, ry, a = .3) { ctx.save(); ctx.strokeStyle = `rgba(${INK},${a})`; ctx.lineWidth = 1.4; ctx.setLineDash([2, 5]); ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.stroke(); ctx.restore(); }
function line(x1, y1, x2, y2, a = .3, dash = null, w = 1) { ctx.save(); ctx.strokeStyle = `rgba(${INK},${a})`; ctx.lineWidth = w; if (dash) ctx.setLineDash(dash); ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore(); }

/* =====================================================================
   4. scenes — every pose is a pure function of local time `lt`,
      and `lt` comes from the single GSAP master timeline.
   ===================================================================== */
const SC = {};
function makeScene(id, build) {
  const g = new THREE.Group(); g.visible = false; scene.add(g);
  const S = { id, g, cam: null, update() {}, draw() {}, phase() { return 0; } };
  build(S, g); SC[id] = S; return S;
}

/* ---------- OPENING: three characters drop in with bounce.out ---------- */
makeScene('open', (S, g) => {
  const items = [
    { m: ball(.62, HEX.red), hh: .62, x: -2.75 },
    { m: box(1.25, 1.25, 1.25, HEX.blue), hh: .625, x: 0, ry: .55 },
    { m: capsule(.46, .9, HEX.yellow), hh: .91, x: 2.75, rz: 0 },
  ];
  items.forEach(it => { it.g = grounded(it.m, it.hh); it.g.position.x = it.x; if (it.ry) it.m.rotation.y = it.ry; g.add(it.g); });
  const st = [.55, 1.45, 2.35], D = .85, Y0 = 7.2, bo = E('bounce.out');
  const yAt = (i, lt) => lerp(Y0, 0, bo(seg(lt, st[i], st[i] + D)));
  S.update = lt => items.forEach((it, i) => {
    it.g.visible = lt >= st[i];
    it.g.position.y = yAt(i, lt);
    // tiny landing squash on each floor contact (volume preserving)
    const y = it.g.position.y, sq = lt > st[i] + .2 && y < .06 ? (1 - y / .06) * .12 * (1 - seg(lt, st[i] + D - .05, st[i] + D + .25)) : 0;
    it.g.scale.set(1 / Math.sqrt(1 - sq), 1 - sq, 1 / Math.sqrt(1 - sq));
  });
  S.phase = lt => { let k = 0; st.forEach((s, i) => { if (lt >= s) k = i; }); return seg(lt, st[k], st[k] + D); };
  S.draw = lt => items.forEach((it, i) => {
    if (lt < st[i]) return;
    const top = yAt(i, lt) + it.hh * 2.2;
    for (let t = st[i]; t <= Math.min(lt, st[i] + D); t += 0.028) {
      const yy = yAt(i, t) + it.hh; if (yy < top) continue;
      const [x, y] = proj(it.x, yy, 0); dot(x, y, 2, .28);
    }
  });
});

/* ---------- 01 SQUASH & STRETCH: bouncing red ball, volume preserved ---------- */
makeScene('p1', (S, g) => {
  const r = .62, m = ball(r, HEX.red);
  const orient = new THREE.Group(); orient.add(m); g.add(orient);
  const xs = [-3.9, -1.3, 1.3, 3.9], Hh = 3.0, T0 = .4, C = .13, T = .92, N = 3;
  // pure pose function → {x, cy, sx, sy, rot, u, contact}
  function pose(lt) {
    let t = lt - T0;
    const rest = (x, sy = 1) => ({ x, cy: r * sy, sx: 1 / Math.sqrt(sy), sy, rot: 0, u: 0 });
    if (t < 0) return rest(xs[0]);
    for (let i = 0; i < N; i++) {
      if (t < C) { const p = rest(xs[i], 1 - .38 * Math.sin(Math.PI * t / C)); p.contact = true; return p; }
      t -= C;
      if (t < T) {
        const u = t / T, x = lerp(xs[i], xs[i + 1], u), h = Hh * 4 * u * (1 - u);
        const vx = (xs[i + 1] - xs[i]) / T, vy = Hh * 4 * (1 - 2 * u) / T;
        const speed = Math.abs(1 - 2 * u);
        const sy = 1 + .3 * speed * speed, sx = 1 / Math.sqrt(sy);
        const rot = -Math.atan2(vx, vy);
        const ext = r * Math.sqrt((sy * Math.cos(rot)) ** 2 + (sx * Math.sin(rot)) ** 2);
        return { x, cy: h + ext, sx, sy, rot, u };
      }
      t -= T;
    }
    if (t < C) { const p = rest(xs[N], 1 - .38 * Math.sin(Math.PI * t / C)); p.contact = true; p.u = 1; return p; }
    const p = rest(xs[N]); p.u = 1; return p;
  }
  const put = (o, mesh, p) => { o.position.set(p.x, p.cy, 0); o.rotation.z = p.rot; mesh.scale.set(p.sx, p.sy, p.sx); };
  // ghosts on the middle hop (onion skin) + squash ghost
  const tHop1 = T0 + C + (C + T);                     // start of 2nd flight
  const gTimes = [tHop1 + .12 * T, tHop1 + .5 * T, tHop1 + .9 * T];
  const tSquash = T0 + 2 * (C + T) + C * .5;          // middle of 3rd contact
  const ghosts = [...gTimes, tSquash].map(t => { const o = new THREE.Group(), gm = ghostOf(m, .2); o.add(gm); g.add(o); put(o, gm, pose(t)); return { o, t }; });
  S.update = lt => {
    const p = pose(lt); put(orient, m, p);
    ghosts.forEach(gh => { gh.o.visible = lt > gh.t + .04; });
  };
  S.phase = lt => pose(lt).u;
  const tEnd = T0 + N * (C + T) + C;
  S.draw = lt => {
    // full arc dot-matrix (faint) + travelled part (strong)
    for (let t = T0; t <= tEnd; t += 0.03) {
      const p = pose(t); if (p.contact) continue;
      const [x, y] = proj(p.x, p.cy, 0); dot(x, y, t <= lt ? 2.4 : 1.6, t <= lt ? .42 : .12);
    }
    // ghost rings at each contact point
    for (let i = 0; i <= N; i++) {
      const tc = T0 + i * (C + T) + C * .5; if (lt < tc) continue;
      const [x, y] = proj(xs[i], 0, 0); ring(x, y, 46, 9, .35);
    }

/* ---------- 02 ANTICIPATION: blue box backs up, compresses, then dashes ---------- */
makeScene('p2', (S, g) => {
  const s = 1.4, m = box(s, s, s, HEX.blue), b = grounded(m, s / 2); g.add(b);
  const x0 = -2.4, x1 = 2.9, A = .45, B = 2.75, ease = E('back.inOut(2.6)');
  const X = lt => lerp(x0, x1, ease(seg(lt, A, B)));
  let eMin = 0, vMax = 0;
  for (let u = 0; u <= 1; u += .002) { eMin = Math.min(eMin, ease(u)); }
  for (let t = A; t <= B; t += .01) vMax = Math.max(vMax, (X(t + .005) - X(t - .005)) / .01);
  function pose(lt) {
    const u = seg(lt, A, B), e = ease(u), v = (X(lt + .005) - X(lt - .005)) / .01;
    const charge = u < .5 && e < 0 ? e / eMin : 0;                // 0..1 while backing up
    const hold = u < .5 ? smooth(seg(u, .0, .3)) * (1 - smooth(seg(u, .3, .42))) : 0;
    const crouch = Math.max(charge, hold * .9);
    const fwd = clamp(v / vMax);
    let sy = 1 - .22 * crouch, sx = 1 / Math.sqrt(sy);
    const st = 1 + .32 * fwd * fwd; sx *= st; sy /= Math.sqrt(st);
    return { x: X(lt), sx, sy, rz: .2 * crouch - .14 * fwd * fwd };
  }
  const put = (o, p) => { o.position.x = p.x; o.scale.set(p.sx, p.sy, 1 / Math.sqrt(p.sx * p.sy) ); o.rotation.z = p.rz; };
  // key moments: deepest anticipation, fastest dash
  let tBack = A, tFast = A, best = 0, vb = 0;
  for (let t = A; t <= B; t += .005) { const e = X(t); if (e < x0 - best) { best = x0 - e; tBack = t; } const v = X(t + .005) - X(t - .005); if (v > vb) { vb = v; tFast = t; } }
  const ghosts = [tBack, tFast].map(t => { const gm = ghostOf(m, .2), o = grounded(gm, s / 2); g.add(o); put(o, pose(t)); return { o, t }; });
  S.update = lt => { put(b, pose(lt)); ghosts.forEach(gh => gh.o.visible = lt > gh.t + .03); };
  S.phase = lt => seg(lt, A, B);
  S.draw = lt => {
    const xNow = X(lt);
    for (let t = A; t <= Math.min(lt, B + .5); t += .035) { if (Math.abs(X(t) - xNow) < s * .62) continue; const [x, y] = proj(X(t), -.02, 1.25); dot(x, y, 2.4, .45); }
    const pb = pose(tBack), [bx, by] = proj(pb.x - .2, s * .95, 0);
    tag(bx, by, bx + 10, by - 110, '蓄力 anticipation', seg(lt, tBack + .05, tBack + .35), -1);
    const [fx, fy] = proj(X(tFast), s * 1.05, 0);
    tag(fx, fy, fx + 50, fy - 95, '衝刺 action', seg(lt, tFast + .05, tFast + .35), 1);
    // direction arrows
    const a = seg(lt, A, A + .3) * (1 - seg(lt, B, B + .3));
    if (a > 0) { const [ox, oy] = proj(x0, -.35, 1.2); ctx.save(); ctx.globalAlpha = a * .55; ctx.font = "500 15px 'JetBrains Mono'"; ctx.fillStyle = `rgb(${INK})`; ctx.textAlign = 'center'; ctx.fillText('← 先退 · 後進 →', ox + 60, oy + 30); ctx.restore(); }
  };
});

/* clone a whole object as a translucent onion-skin ghost */
function ghostGroup(obj, opacity = 0.22) {
  const c = obj.clone(true);
  c.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); Object.assign(o.material, { transparent: true, opacity, depthWrite: false }); o.castShadow = false; o.receiveShadow = false; o.renderOrder = 2; } });
  return c;
}
function text2d(x, y, s, a = 1, align = 'left', size = 16) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = `rgb(${INK})`;
  ctx.font = `500 ${size}px 'JetBrains Mono','Noto Sans TC',monospace`; if ('letterSpacing' in ctx) ctx.letterSpacing = '0.04em';
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y); ctx.restore();
}

makeScene('p4', (S, g) => {

  const tube = finish(new THREE.Mesh(new THREE.TubeGeometry(curve, TS, .075, RS, false), clay(HEX.ink)));
  const pen = ball(.17, HEX.red); g.add(tube, pen);
  const SA = .45, SB = 3.55, steps = Math.round((SB - SA) * 12);

  const ghosts = K.map(k => { const gh = ghostGroup(cap, .2); gh.position.set(...k.p); gh.rotation.z = k.r; g.add(gh); return gh; });
  const TW = [[.55, 1.45], [1.6, 2.5], [2.65, 3.55]], ease = E('power2.inOut');
  function pose(lt) {
    let i = 0, u = 0;
    if (lt < TW[0][0]) { i = 0; u = 0; }

    const a = K[i], b = K[(i + 1) % 3], e = ease(u);
    return { p: a.p.map((v, j) => lerp(v, b.p[j], e)), r: lerp(a.r, b.r, e), u, i };
  }

    const p = drawn(lt);
    tube.geometry.setDrawRange(0, Math.floor(p * TS) * RS * 6);
    pen.position.copy(curve.getPointAt(Math.max(p, .001))); pen.visible = lt > SA - .1;
    const q = pose(lt); cap.position.set(...q.p); cap.rotation.z = q.r;

makeScene('p5', (S, g) => {

  const N = 7, L = .27, beads = [];
  for (let k = 0; k < N; k++) { const b = ball(.105, HEX.ink); beads.push(b); g.add(b); }
  const tail = ball(.3, HEX.red); g.add(tail);
  const xA = -2.6, xB = 1.4, A = .35, B = 1.35, mv = E('power2.inOut');
  const X = t => lerp(xA, xB, mv(seg(t, A, B)));

  let vmax = 0; for (let t = A; t <= B; t += .01) vmax = Math.max(vmax, V(t));
  const D = .075, OSC = 2.3;
  const damp = u => u <= 0 ? 0 : Math.exp(-2.3 * u) * Math.sin(10.6 * u);
  const ang = (k, t) => { const td = t - k * D, amp = .16 + .5 * (k + 1) / N; return -amp * .9 * V(td) / vmax + amp * damp((td - B) / OSC); };
  function chain(t) {
    let x = X(t), y = bs + .02; const out = [];
    for (let k = 0; k < N; k++) { const f = ang(k, t); x += L * Math.sin(f); y += L * Math.cos(f); out.push([x, y]); }
    const f = ang(N, t); out.push([x + (L + .12) * Math.sin(f), y + (L + .12) * Math.cos(f)]);
    return out;
  }
  S.update = lt => {
    bG.position.x = X(lt);
    const c = chain(lt); beads.forEach((b, k) => b.position.set(c[k][0], c[k][1], 0)); tail.position.set(c[N][0], c[N][1], 0);
  };
  S.phase = lt => clamp((lt - N * D - B) / OSC);
  S.draw = lt => {
    // body path + tail path (dot matrix)
    for (let t = A; t <= Math.min(lt, B); t += .04) { const [x, y] = proj(X(t), -.02, 1.0); dot(x, y, 2.2, .4); }
    for (let t = B; t <= lt; t += .03) { const c = chain(t); const [x, y] = proj(c[N][0], c[N][1], 0); dot(x, y, 2, .32, '232,81,58'); }

    text2d(mx, my + 26, '→ 主體移動', seg(lt, A, A + .3) * (1 - seg(lt, B + .4, B + .8)) * .6, 'center', 15);

/* ---------- 09 TIMING: same drop, 6 / 12 / 24 frames ---------- */
makeScene('p9', (S, g) => {
  const H0 = 3.3, f = E('power2.in'), up = E('power2.inOut'), R1 = .45, RISE = [1.7, 2.2], R2 = 2.35;
  const defs = [
    { r: .3, c: HEX.yellow, x: -2.9, n: 6, w: '輕 light' },
    { r: .45, c: HEX.red, x: 0, n: 12, w: '' },
    { r: .64, c: HEX.blue, x: 2.9, n: 24, w: '重 heavy' },
  ];
  defs.forEach(d => { d.m = ball(d.r, d.c); g.add(d.m); d.dur = d.n / 24; });
  const start = lt => lt < RISE[0] ? R1 : R2;
  function hAt(d, lt) {
    if (lt >= RISE[0] && lt < RISE[1]) return H0 * up(seg(lt, RISE[0], RISE[1])) * (lt > R1 + d.dur ? 1 : 1);
    const st = start(lt); return H0 * (1 - f(seg(lt, st, st + d.dur)));
  }
  function squash(d, lt) {
    if (lt >= RISE[0] && lt < RISE[1]) return 1;
    const tl = lt - (start(lt) + d.dur); return tl > 0 && tl < .18 ? 1 - .22 * Math.sin(Math.PI * tl / .18) : 1;
  }
  S.update = lt => defs.forEach(d => { const sy = squash(d, lt), sx = 1 / Math.sqrt(sy); d.m.scale.set(sx, sy, sx); d.m.position.set(d.x, hAt(d, lt) + d.r * sy, 0); });
  S.phase = lt => lt < RISE[0] ? seg(lt, R1, R1 + 1) : lt < RISE[1] ? 1 - seg(lt, RISE[0], RISE[1]) : seg(lt, R2, R2 + 1);
  S.draw = lt => {
    const a = seg(lt, .15, .5);

      if (d.w) { const [wx, wy] = proj(d.x, -.25, .8); text2d(wx, wy + 18, d.w, a * .7, 'center', 14); }

      const st = start(lt), shown = lt >= RISE[0] && lt < RISE[1] ? d.n : Math.min(d.n, Math.floor((lt - st) * 24 + 1e-6));
      for (let k = 0; k <= d.n; k++) {

  p8: { n: 8, theme: 'blue', title: ['Secondary', 'Action'], zh: '附屬動作',
        desc: ['在主要動作之外，加一個輔助的小動作，', '讓角色更有生命，但不能搶走焦點。'],
        ease: { name: '4u(1-u)', note: '跳躍高度', fn: u => 4 * u * (1 - u) } },
  p9: { n: 9, theme: 'yellow', title: ['Timing'], zh: '時間控制',
        desc: ['距離一樣，格數不同，重量感就不同。', '格數越少，看起來越輕快。'],
        ease: { name: 'power2.in', note: '下落・24 格那顆', fn: E('power2.in') } },
  p10: { n: 10, theme: 'blue', title: ['Exaggeration'], zh: '誇張',
        desc: ['把動作推得比現實更遠，觀眾才讀得清楚。', '擠壓更深、跳得更高、回彈更久。'],
        ease: { name: 'elastic.out(1.2, 0.3)', note: '誇張那顆的落地回彈', fn: E('elastic.out(1.2, 0.3)') } },
  p11: { n: 11, theme: 'red', title: ['Solid', 'Drawing'], zh: '立體造型',
        desc: ['把形體當成有體積、有重量的立體物來畫。', '轉到任何角度，它都站得住。'],
        ease: { name: 'linear', note: '轉台角度・等速', fn: u => u } },
  p12: { n: 12, theme: 'blue', title: ['Appeal'], zh: '吸引力',
        desc: ['讓角色好看、好懂，讓人想一直看下去。', '圓潤的形狀和清楚的表情最有效。'],
        ease: { name: 'elastic.out(1, 0.4)', note: '落地的回彈', fn: E('elastic.out(1, 0.4)') } },
};
const CARDS = {
  cE: { n: 12, color: 'yellow', kick: 'Epilogue', zh: '十二法則，演完了', en: 'All twelve, in motion.' },
};

/* =====================================================================
   6. DOM pages
   ===================================================================== */
const PG = {};
const backs = $('#backs'), fronts = $('#fronts');
function easeCard(e, theme) {
  const card = el('div', 'ease');
  card.style.setProperty('--c', HEX[theme]);
  card.innerHTML = `<div class="eh"><span>EASING</span><b>${e.name}</b></div>
    <svg viewBox="0 0 294 104"><path class="grid"/><path class="curve2"/><path class="curve"/><circle class="pt2" r="5" style="display:none"/><circle class="pt" r="6.5"/></svg>
    <div class="en">${e.note}</div>`;
  const svg = $('svg', card), PADX = 10, PADY = 12, SW = 294, SH = 104;
  const fns = [e.fn, e.fn2].filter(Boolean);
  let lo = 0, hi = 1;
  fns.forEach(f => { for (let i = 0; i <= 200; i++) { const v = f(i / 200); lo = Math.min(lo, v); hi = Math.max(hi, v); } });
  const mx = u => PADX + u * (SW - 2 * PADX), my = v => SH - PADY - (v - lo) / (hi - lo) * (SH - 2 * PADY);
  const path = f => { let d = ''; for (let i = 0; i <= 120; i++) { const u = i / 120; d += (i ? 'L' : 'M') + mx(u).toFixed(1) + ' ' + my(f(u)).toFixed(1); } return d; };
  $('.curve', svg).setAttribute('d', path(e.fn));
  if (e.fn2) $('.curve2', svg).setAttribute('d', path(e.fn2));
  $('.grid', svg).setAttribute('d', `M${PADX} ${my(0)}H${SW - PADX}M${PADX} ${my(1)}H${SW - PADX}`);
  const pt = $('.pt', svg), pt2 = $('.pt2', svg);
  if (e.fn2) { pt2.style.display = ''; if (e.dot2) pt2.style.fill = e.dot2; }
  return { card, set(u, u2) {
    pt.setAttribute('cx', mx(u)); pt.setAttribute('cy', my(e.fn(u)));
    if (e.fn2) { const v = u2 ?? u; pt2.setAttribute('cx', mx(v)); pt2.setAttribute('cy', my(e.fn2(v))); }
  } };
}
function buildPrinciple(id, d) {
  const back = el('div', 'page'); back.appendChild(el('div', 'wm', pad2(d.n))); backs.appendChild(back);
  const front = el('section', 'page');
  front.style.setProperty('--c', HEX[d.theme]);
  front.innerHTML = `
    <header class="chap"><span class="no">Principle No. ${d.n}</span><span class="rule"><i></i></span><span class="cnt">${pad2(d.n)} / 12</span></header>
    <div class="head"><h1 class="ttl">${d.title.map(t => `<span class="ln"><span>${t.replace('&', '&amp;')}</span></span>`).join('')}</h1>
    <h2 class="sub"><span class="ln"><span>${d.zh}</span></span></h2></div>
    <p class="desc">${d.desc.join('<br>')}</p>`;
  const ec = easeCard(d.ease, d.theme); front.appendChild(ec.card);
  fronts.appendChild(front);
  const rd = $('.rule i', front);
  PG[id] = { back, front, wm: $('.wm', back), chap: $('.chap', front), ttl: $('.ttl', front), titleSpans: [...front.querySelectorAll('.ttl .ln>span')],
    zhSpans: [...front.querySelectorAll('.sub .ln>span')], desc: $('.desc', front), ease: ec.card, theme: d.theme,
    progress(p) { rd.style.left = (p * 100).toFixed(2) + '%'; }, setEase: ec.set };
}
function buildCover() {
  const back = el('div', 'page'); back.appendChild(el('div', 'wm', '12')); backs.appendChild(back);
  const front = el('section', 'page cover');
  front.style.setProperty('--c', HEX.red);
  front.innerHTML = `
    <div class="kick chap"><span>OPUS 5.5 × THREE.JS × P5.JS × GSAP</span><span class="rule"></span></div>
    <div class="head"><h1 class="zhT"><span class="ln"><span>動態設計十二法則</span></span></h1>
    <h2 class="enT"><span class="ln"><span>The 12 Principles of Animation</span></span></h2></div>
    <p class="desc">1981 年，迪士尼動畫師 Ollie Johnston 與 Frank Thomas<br>在《The Illusion of Life》裡，整理出這十二條動畫原則。</p>`;
  const ec = easeCard({ name: 'bounce.out', note: '落下・位置 Y', fn: E('bounce.out') }, 'red'); front.appendChild(ec.card);
  fronts.appendChild(front);
  PG.open = { back, front, wm: $('.wm', back), chap: $('.kick', front), titleSpans: [...front.querySelectorAll('.zhT .ln>span')],
    zhSpans: [...front.querySelectorAll('.enT .ln>span')], desc: $('.desc', front), ease: ec.card, theme: 'neutral',
    progress() {}, setEase: ec.set };
}
function buildEpilogue() {
  const back = el('div', 'page'); backs.appendChild(back);
  const front = el('section', 'page epi');
  front.style.setProperty('--c', HEX.red);
  const names = ['擠壓與伸展', '預備動作', '演出佈局', '連續動作與關鍵姿勢', '跟隨與重疊動作', '漸快與漸慢', '弧形軌跡', '附屬動作', '時間控制', '誇張', '立體造型', '吸引力'];
  front.innerHTML = `
    <header class="chap"><span class="no">Epilogue</span><span class="rule"><i></i></span><span class="cnt">12 / 12</span></header>
    <div class="head"><h1 class="ttl"><span class="ln"><span>Your turn.</span></span></h1>
    <h2 class="sub"><span class="ln"><span>換你讓它動起來。</span></span></h2></div>
    <ol class="idx">${names.map((n, i) => `<li><b>${pad2(i + 1)}</b><span>${n}</span></li>`).join('')}</ol>`;
  fronts.appendChild(front);
  const rd = $('.rule i', front);
  PG.epi = { back, front, chap: $('.chap', front), titleSpans: [...front.querySelectorAll('.ttl .ln>span')], zhSpans: [...front.querySelectorAll('.sub .ln>span')],
    items: [...front.querySelectorAll('.idx li')], theme: 'neutral', progress(p) { rd.style.left = (p * 100).toFixed(2) + '%'; }, setEase() {} };
}
function buildFin() {
  const back = el('div', 'page'); backs.appendChild(back);
  const front = el('section', 'page fin');
  front.innerHTML = `<div class="fwrap">
    <h1 class="fzh fbrand"><span class="ln"><span>iPadARt.net</span></span></h1>
    <h2 class="fen"><span class="ln"><span>The 12 Principles of Animation</span></span></h2>
    <div class="fnote"><i></i><p>關於動態思維，你是否從設計賦能中發現改變？</p></div></div>`;
  fronts.appendChild(front);
  PG.fin = { back, front, chap: $('.fword', front), titleSpans: [...front.querySelectorAll('.fzh .ln>span')], zhSpans: [...front.querySelectorAll('.fen .ln>span')],
    desc: $('.fnote', front), theme: 'dark', progress() {}, setEase() {} };
}
function buildCard(id, d) {
  const c = el('div', 'card');
  c.style.setProperty('--cc', HEX[d.color]);
  c.style.setProperty('--ct', d.color === 'yellow' ? HEX.ink : '#FFFFFF');
  const inner = (d.kick ? `<div class="ckick">${d.kick}</div>` : '') + `<div class="num">${pad2(d.n)}</div><div class="czh">${d.zh}</div><div class="cen">${d.en}</div>`;
  const ghosts = [-260, -170, -90, 90, 170, 260].map(k => `<div class="layer g" style="--k:${k}">${inner}</div>`).join('');
  c.innerHTML = `<div class="stack">${ghosts}<div class="layer main">${inner}</div></div>`;
  $('#cards').appendChild(c);
  PG[id] = { card: c };
}
function fitTitles() {
  Object.values(PG).forEach(p => {
    if (!p.ttl) return;
    const maxW = 1080 - 68 - 72;
    let fs = 112; p.ttl.style.fontSize = fs + 'px';
    const wMax = Math.max(...p.titleSpans.map(s => s.getBoundingClientRect().width / currentScale()));
    if (wMax > maxW) p.ttl.style.fontSize = Math.floor(fs * maxW / wMax) + 'px';
  });
}
const currentScale = () => stage.getBoundingClientRect().width / W;

/* =====================================================================
   7. sequence + ONE GSAP master timeline
   ===================================================================== */
// 4–58s holds the 12 principles → 4.5s each
const P = 54 / 12;
const SEQ = [
  ['scene', 'open', 4],
  ['scene', 'p1', P], ['scene', 'p2', P], ['scene', 'p3', P], ['scene', 'p4', P],
  ['scene', 'p5', P], ['scene', 'p6', P], ['scene', 'p7', P], ['scene', 'p8', P],
  ['scene', 'p9', P], ['scene', 'p10', P], ['scene', 'p11', P], ['scene', 'p12', P],
  ['card', 'cE', 1.2], ['scene', 'epi', 4.8], ['scene', 'fin', 2],
];
const SEGS = []; { let t = 0; SEQ.forEach(([type, id, dur]) => { SEGS.push({ type, id, start: t, dur, end: t + dur }); t += dur; }); }
const TOTAL = SEGS[SEGS.length - 1].end;
const segAt = t => SEGS.find(s => t >= s.start && t < s.end) || SEGS[SEGS.length - 1];
const NAV = SEGS.filter(s => s.type === 'scene');

let tl;
function buildTimeline() {
  tl = gsap.timeline({ paused: true });
  const glwrap = $('#glwrap'), bg = $('#bg'), tdot = $('#topbar .dot'), topbar = $('#topbar');
  Object.values(PG).forEach(p => {
    if (p.front) gsap.set([p.front, p.back], { autoAlpha: 0 });
    if (p.titleSpans) gsap.set([...p.titleSpans, ...(p.zhSpans || [])], { yPercent: 118 });
    if (p.card) gsap.set(p.card, { autoAlpha: 0 });
  });
  SEGS.forEach(sg => {
    const s = sg.start, e = sg.end, p = PG[sg.id];
    if (sg.type === 'card') {
      const c = p.card;
      tl.set(c, { autoAlpha: 1 }, s);
      tl.fromTo(c, { yPercent: 100, '--mb': 1 }, { yPercent: 0, '--mb': 0, duration: .26, ease: 'power3.out', immediateRender: false }, s);
      tl.to(c, { yPercent: -100, '--mb': 1, duration: .24, ease: 'power3.in' }, e - .24);
      tl.set(c, { autoAlpha: 0 }, e);
      return;
    }
    const theme = p.theme, fin = sg.id === 'fin', has = x => x && (!Array.isArray(x) || x.length);
    // background + top-bar cross-dissolve to the page's theme
    tl.to(bg, { backgroundColor: BG[theme], duration: sg.id === 'open' ? .01 : .55, ease: 'power2.inOut' }, s);
    tl.to(tdot, { backgroundColor: theme === 'neutral' || theme === 'dark' ? HEX.red : HEX[theme], duration: .4 }, s);
    tl.to(topbar, { color: fin ? '#F4F2EE' : HEX.ink, duration: .4 }, s);
    // page in
    tl.set([p.front, p.back], { autoAlpha: 1, y: 0, filter: 'blur(0px)' }, s);
    if (fin) tl.fromTo(p.front, { opacity: 0 }, { opacity: 1, duration: .5, ease: 'power1.out', immediateRender: false }, s);
    if (has(p.wm)) tl.fromTo(p.wm, { opacity: 0, scale: 1.06 }, { opacity: .06, scale: 1, duration: 1.1, ease: 'power2.out', immediateRender: false }, s);
    if (has(p.chap)) tl.fromTo(p.chap, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: .5, ease: 'power2.out', immediateRender: false }, s + .05);
    if (has(p.titleSpans)) tl.fromTo(p.titleSpans, { yPercent: 118 }, { yPercent: 0, duration: .8, ease: 'power3.out', stagger: .07, immediateRender: false }, s + .1);
    if (has(p.zhSpans)) tl.fromTo(p.zhSpans, { yPercent: 118 }, { yPercent: 0, duration: .8, ease: 'power3.out', immediateRender: false }, s + .25);
    if (has(p.desc)) tl.fromTo(p.desc, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: .6, ease: 'power2.out', immediateRender: false }, s + .45);
    if (has(p.ease)) tl.fromTo(p.ease, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: .6, ease: 'power2.out', immediateRender: false }, s + .55);
    if (has(p.items)) tl.fromTo(p.items, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: .45, ease: 'power2.out', stagger: .14, immediateRender: false }, s + .7);
    if (fin) return;                               // last page: no 3D, no exit
    tl.fromTo(glwrap, { opacity: 0, y: 0, filter: 'blur(0px)' }, { opacity: 1, duration: .3, ease: 'power1.out', immediateRender: false }, s);
    // page out: drift up + fade + slight blur
    const out = { y: -48, autoAlpha: 0, filter: 'blur(10px)', duration: .4, ease: 'power2.in' };
    tl.to([p.front, p.back], out, e - .4);
    tl.to(glwrap, { y: -48, opacity: 0, filter: 'blur(10px)', duration: .4, ease: 'power2.in' }, e - .4);
  });
  tl.set({}, {}, TOTAL);
}

/* =====================================================================
   8. per-tick render (rAF via gsap.ticker) — 3D, overlay, easing dots
   ===================================================================== */
const tcEl = $('#tc'), hud = $('#hud'), hudBar = $('#hudBar i'), hudT = $('#hudT'), hudS = $('#hudS');
function timecode(t) { const f = Math.floor(t * 24 + 1e-6); return `${pad2(Math.floor(f / 86400))}:${pad2(Math.floor(f / 1440) % 60)}:${pad2(Math.floor(f / 24) % 60)}:${pad2(f % 24)}`; }
let active = null;
function frame() {
  if (!tl) return;
  const t = tl.time(), sg = segAt(t);
  tcEl.textContent = timecode(t);
  const sid = sg.type === 'scene' ? sg.id : null;
  if (sid !== active) { if (active && SC[active]) SC[active].g.visible = false; if (sid && SC[sid]) SC[sid].g.visible = true; active = sid; }
  ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0); ctx.clearRect(0, 0, GL.w, GL.h);
  if (sid && SC[sid]) {
    const S = SC[sid], lt = t - sg.start;
    S.update(lt);
    applyCam(S.cam ? S.cam(lt) : null);
    renderer.render(scene, camera);
    S.draw(lt);
    const p = PG[sid]; p.progress(clamp(lt / sg.dur)); const ph = S.phase(lt); Array.isArray(ph) ? p.setEase(...ph) : p.setEase(ph);
  }
  if (hud.classList.contains('on')) { hudBar.style.width = (t / TOTAL * 100) + '%'; hudT.textContent = t.toFixed(2) + 's / ' + TOTAL.toFixed(1) + 's'; hudS.textContent = sg.id + (tl.paused() ? ' · paused' : ''); }
}

/* =====================================================================
   9. hidden keyboard controls
   ===================================================================== */
function jumpTo(i) { const s = NAV[clamp(i, 0, NAV.length - 1)]; tl.seek(s.start + .001, false); }
function navIndex() { const t = tl.time(); let k = 0; NAV.forEach((s, i) => { if (t >= s.start - .01) k = i; }); return k; }
let digitBuf = '', digitTimer = 0;
addEventListener('keydown', e => {
  if (!tl) return;
  if (e.code === 'Space') { e.preventDefault(); tl.paused(!tl.paused()); }
  else if (e.key === 'r' || e.key === 'R') tl.restart();
  else if (e.key === 'ArrowRight') jumpTo(navIndex() + 1);
  else if (e.key === 'ArrowLeft') { const k = navIndex(); jumpTo(tl.time() - NAV[k].start > .6 ? k : k - 1); }
  else if (e.key === 'h' || e.key === 'H') hud.classList.toggle('on');
  else if (/^[0-9]$/.test(e.key)) {          // type 1–12 (two digits within 0.45s), 0 = cover
    digitBuf += e.key; clearTimeout(digitTimer);
    digitTimer = setTimeout(() => {
      const n = parseInt(digitBuf, 10); digitBuf = '';
      const idx = NAV.findIndex(s => s.id === (n === 0 ? 'open' : 'p' + n));
      if (idx >= 0) jumpTo(idx);
    }, 450);
  }
});
$('#hudBar').addEventListener('click', e => { const r = e.currentTarget.getBoundingClientRect(); tl.seek((e.clientX - r.left) / r.width * TOTAL, false); });

/* =====================================================================
   10. boot
   ===================================================================== */
buildCover();
Object.entries(PRINCIPLES).forEach(([id, d]) => buildPrinciple(id, d));
Object.entries(CARDS).forEach(([id, d]) => buildCard(id, d));
buildEpilogue(); buildFin();
const fontsReady = Promise.all([
  "800 100px Archivo", "italic 400 40px 'Instrument Serif'", "500 16px 'JetBrains Mono'", "700 16px 'JetBrains Mono'",
  "900 40px 'Noto Sans TC'", "500 20px 'Noto Sans TC'",
].map(f => document.fonts.load(f, '動態設計十二法則 Aa01'))).then(() => document.fonts.ready);
await Promise.race([fontsReady, new Promise(r => setTimeout(r, 5000))]);
fitTitles();
// pre-compile every material once so scene switches never hitch on shader compilation
Object.values(SC).forEach(S => S.g.visible = true); applyCam(null); renderer.compile(scene, camera); renderer.render(scene, camera);
Object.values(SC).forEach(S => S.g.visible = false);
buildTimeline();
gsap.ticker.add(frame);
window.tl = tl; window.SEGS = SEGS;
if (SHOT) { tl.seek(parseFloat(params.get('t')) || 0); tl.pause(); frame(); }
else tl.play(0);
window.__ready = true;
</script>
